[package]
name = "jgp-meeting"
version = "0.1.0"
description = "JGP Meeting - Assistente inteligente de reuniões"
authors = ["JGP"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2
tauri = { version = "2", features = ["devtools", "tray-icon"] }

# Plugins Tauri v2
tauri-plugin-global-shortcut = "2"

# Serialização
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Runtime async
tokio = { version = "1", features = ["full"] }

# HTTP client para APIs (Whisper + OpenAI)
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "cookies"] }

# Utilitários
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

# Encoding de áudio WAV
hound = "3.5"

# Utilitários de sistema
sysinfo = "0.30"   # Feature 12: Detecção de apps de reunião por processo
open    = "5"      # Feature 4:  Abrir pasta no explorador de arquivos
tempfile = "3"     # Feature 7:  Arquivos temporários para Whisper local

[target.'cfg(windows)'.dependencies]
# APIs Windows para WASAPI loopback — usadas diretamente para evitar o bug do
# crate wasapi 0.14 com AUDCLNT_BUFFERFLAGS_SILENT (ponteiro nulo → abort).
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",  # PROPVARIANT (param de IMMDevice::Activate)
    "Win32_System_Variant",                # VARIANT (dentro de PROPVARIANT)
    "Win32_Devices_Properties",            # DEVPKEY_Device_FriendlyName (listagem de mics)
    "Win32_UI_Shell_PropertiesSystem",      # IPropertyStore (OpenPropertyStore em IMMDevice)
] }

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
